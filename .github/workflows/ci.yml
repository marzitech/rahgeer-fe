name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Reproducible install from the committed lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Next generates the global route types (PageProps/LayoutProps) during
      # build — typegen produces them without a full build so standalone tsc
      # can resolve them.
      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npm run type-check

      # Build is the real gate — it generates the typed routes tsc alone
      # can't see and catches anything the checks above miss.
      - name: Build
        run: npm run build
